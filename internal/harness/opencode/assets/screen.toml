version = 1
agent = "opencode"

[[rules]]
id = "permission_prompt"
state = "waiting"
detail = "permission"
priority = 300
region = "bottom:30"
all = ["permission"]
any = ["allow", "approve", "deny", "reject"]

[[rules]]
id = "question_prompt"
state = "waiting"
detail = "question"
priority = 250
region = "bottom:30"
any = ["Question requires input", "Select an option", "Waiting for input"]

[[rules]]
id = "working_interruptible"
state = "running"
priority = 200
region = "bottom:20"
any = ["esc to interrupt", "ctrl+c to interrupt"]

[[rules]]
id = "input_prompt"
state = "idle"
priority = 100
region = "bottom:12"
any = ["Ask anything", "Type a message", "Send a message"]
none = ["esc to interrupt", "permission"]

[[rules]]
id = "error_prompt"
state = "failed"
detail = "general"
priority = 350
region = "bottom:30"
any = ["API error", "Execution error", "Failed to run"]
none = ["esc to interrupt"]

[[rules]]
id = "interrupted_prompt"
state = "interrupted"
priority = 220
region = "bottom:25"
any = ["Stopped by user", "Operation cancelled", "Interrupted"]
none = ["esc to interrupt"]
