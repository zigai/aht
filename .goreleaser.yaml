version: 2
project_name: aht

before:
  hooks:
    - go mod tidy -diff

builds:
  - main: ./main.go
    binary: aht
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/zigai/aht/v2/internal/cli.version={{.Version}}
      - -X github.com/zigai/aht/v2/internal/cli.commit={{.ShortCommit}}
      - -X github.com/zigai/aht/v2/internal/cli.date={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:

      - LICENSE

      - README.md

nfpms:
  - id: aht
    package_name: aht
    vendor: zigai
    homepage: https://github.com/zigai/aht
    maintainer: zigai
    description: Track local coding-agent sessions across harnesses and terminal multiplexers
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: desc
  abbrev: 7
  format: '[`{{ printf "%.7s" .SHA }}`](https://github.com/zigai/aht/commit/{{ .SHA }}) {{ .Message }}'
  groups:
    - title: Features
      regexp: '^.*?feat(\([^)]+\))?!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([^)]+\))?!?:.+$'
      order: 1
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - '^docs(\([^)]+\))?!?:'
      - '^test(\([^)]+\))?!?:'
      - '^ci(\([^)]+\))?!?:'
      - '^chore(\([^)]+\))?!?:'

release:
  github:
    owner: zigai
    name: aht
  draft: true
  prerelease: auto
