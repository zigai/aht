# Pinned without adding lefthook to go.mod, where its dependencies would reach
# consumers of the aht module. Install the hooks once per clone with:
#   go run github.com/evilmartians/lefthook/v2@v2.1.14 install
lefthook: go run github.com/evilmartians/lefthook/v2@v2.1.14

pre-push:
  jobs:
    - name: check
      run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE -u GIT_PREFIX -u GIT_OBJECT_DIRECTORY just check
