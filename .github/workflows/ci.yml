name: CI

on:
  pull_request:
  push:
    branches:
      - master
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  affected-hosts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Select affected hosts and resolve distributions
        id: select
        env:
          AHT_COMPAT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          AHT_COMPAT_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: go run ./internal/tools/compatibility changes

  changed-hosts:
    needs: affected-hosts
    if: needs.affected-hosts.outputs.selected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.affected-hosts.outputs.matrix) }}
    uses: ./.github/workflows/compatibility-host.yml
    with:
      harness: ${{ matrix.harness }}
      version: ${{ matrix.version }}

  change-compatibility:
    name: change-compatibility
    if: ${{ always() }}
    needs: [affected-hosts, changed-hosts]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Require complete change compatibility
        env:
          SELECTOR_RESULT: ${{ needs.affected-hosts.result }}
          SELECTED: ${{ needs.affected-hosts.outputs.selected }}
          HOSTS_RESULT: ${{ needs.changed-hosts.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SELECTOR_RESULT" = success
          case "$SELECTED:$HOSTS_RESULT" in
            false:skipped) echo "No affected harnesses." ;;
            true:success) echo "All affected harnesses passed." ;;
            *) echo "Compatibility selection or host jobs failed or are incomplete." >&2; exit 1 ;;
          esac

  verify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux

      - name: Verify source
        run: just check

  verify-darwin:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Install tmux
        run: brew install tmux

      - name: Verify source
        run: just check

  build-snapshot:
    needs:
      - verify-linux
      - verify-darwin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.13.3
          install-only: true


      - name: Build snapshot
        run: just snapshot

      - name: Upload snapshot
        uses: actions/upload-artifact@v6
        with:
          name: snapshot-${{ github.sha }}
          path: dist
          retention-days: 14

  native-artifact-validation:
    name: native-artifact-validation (${{ matrix.target }})
    needs:
      - build-snapshot
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Download snapshot
        uses: actions/download-artifact@v7
        with:
          name: snapshot-${{ github.sha }}
          path: dist

      - name: Install package inspectors
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dpkg rpm

      - name: Validate native artifact
        shell: bash
        run: |
          set -o pipefail
          just artifacts dist 2>&1 | tee artifact-validation.log

      - name: Upload failed validation evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: snapshot-validation-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/artifacts.json
            dist/metadata.json
            dist/checksums.txt
            artifact-validation.log
          retention-days: 14

  artifact-validation:
    if: ${{ always() }}
    needs:
      - build-snapshot
      - native-artifact-validation
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Require every artifact gate
        run: |
          test "${{ needs.build-snapshot.result }}" = "success"
          test "${{ needs.native-artifact-validation.result }}" = "success"
