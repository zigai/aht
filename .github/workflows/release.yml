# Actions are pinned to commit SHAs here because this workflow can publish
# releases; a moved tag must not change what builds or uploads user binaries.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require current protected master
        id: tag
        run: |
          git fetch origin master
          tag_commit=$(git rev-parse HEAD)
          master_commit=$(git rev-parse origin/master)
          if [ "${tag_commit}" != "${master_commit}" ]; then
            echo "Error: release tag must point at current protected master (${master_commit}), got ${tag_commit}." >&2
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for the tag commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AHT_RELEASE_SHA: ${{ steps.tag.outputs.commit }}
        with:
          retries: 3
          script: |
            await require('./.github/scripts/release.cjs').requireCI({ github, context, core, sha: process.env.AHT_RELEASE_SHA });

  build-release:
    needs:
      - verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          profile: package

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Read GoReleaser version
        id: goreleaser
        run: echo "version=$(just --evaluate goreleaser_version)" >> "$GITHUB_OUTPUT"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          install-only: true

      - name: Build release before publication
        run: just release-build

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  native-artifact-validation:
    name: native-artifact-validation (${{ matrix.target }})
    needs:
      - build-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          profile: artifacts

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: dist

      - name: Install package inspectors
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dpkg rpm

      - name: Validate native artifact
        shell: bash
        run: |
          set -o pipefail
          just artifacts dist 2>&1 | tee artifact-validation.log

      - name: Upload failed validation evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/artifacts.json
            dist/metadata.json
            dist/checksums.txt
            artifact-validation.log
          retention-days: 14

  publish-release:
    needs:
      - verify-tag
      - build-release
      - native-artifact-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      AHT_RELEASE_SHA: ${{ needs.verify-tag.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          profile: artifacts

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Download tested artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: dist

      - name: Prepare owned draft after native validation
        id: draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const notes = require('node:fs').readFileSync('dist/CHANGELOG.md', 'utf8');
            await require('./.github/scripts/release.cjs').prepareDraft({ github, context, core, sha: process.env.AHT_RELEASE_SHA, notes });

      - name: Upload tested release assets
        if: steps.draft.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(jq -r '.[] | select(.type == "Archive" or .type == "Linux Package" or .type == "Checksum") | .name' dist/artifacts.json)
          test "${#assets[@]}" -gt 0
          for asset in "${assets[@]}"; do
            gh release upload "$GITHUB_REF_NAME" "dist/$asset" --clobber --repo "$GITHUB_REPOSITORY"
          done

      - name: Download draft assets
        if: steps.draft.outputs.published != 'true'
        run: |
          set -o pipefail
          release_id=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq .databaseId)
          mkdir -p draft-assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate --jq '.[] | [.id, .name] | @tsv' |
            while IFS=$'\t' read -r asset_id asset_name; do
              gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                --header "Accept: application/octet-stream" > "draft-assets/${asset_name}"
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install package inspectors
        if: steps.draft.outputs.published != 'true'
        run: sudo apt-get update && sudo apt-get install --yes dpkg rpm

      - name: Compare draft assets with tested artifacts
        if: steps.draft.outputs.published != 'true'
        run: just artifacts dist draft-assets

      - name: Publish verified release
        if: steps.draft.outputs.published != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AHT_RELEASE_ID: ${{ steps.draft.outputs.release-id }}
        with:
          script: |
            await require('./.github/scripts/release.cjs').publishDraft({ github, context, core, sha: process.env.AHT_RELEASE_SHA, releaseID: Number(process.env.AHT_RELEASE_ID) });

  cleanup-failed-draft:
    if: ${{ always() && needs.verify-tag.result == 'success' && needs.publish-release.result != 'success' }}
    needs:
      - verify-tag
      - publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reconcile and delete only this run's unpublished draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AHT_RELEASE_SHA: ${{ needs.verify-tag.outputs.commit }}
        with:
          script: |
            await require('./.github/scripts/release.cjs').cleanupDraft({ github, context, core, sha: process.env.AHT_RELEASE_SHA });
