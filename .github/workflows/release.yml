name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require current protected master
        run: |
          git fetch origin master
          tag_commit=$(git rev-parse HEAD)
          master_commit=$(git rev-parse origin/master)
          if [ "${tag_commit}" != "${master_commit}" ]; then
            echo "Error: release tag must point at current protected master (${master_commit}), got ${tag_commit}." >&2
            exit 1
          fi

  build-draft:
    needs:
      - verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.13.3
          install-only: true

      - name: Build draft release
        run: just release-draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ github.sha }}
          path: dist
          retention-days: 14

  native-artifact-validation:
    name: native-artifact-validation (${{ matrix.target }})
    needs:
      - build-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: dist

      - name: Install package inspectors
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dpkg rpm

      - name: Validate native artifact
        shell: bash
        run: |
          set -o pipefail
          just artifacts dist 2>&1 | tee artifact-validation.log

      - name: Upload failed validation evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-validation-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/artifacts.json
            dist/metadata.json
            dist/checksums.txt
            artifact-validation.log
          retention-days: 14

  publish-release:
    needs:
      - build-draft
      - native-artifact-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Download tested artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: dist

      - name: Download draft assets
        run: |
          set -o pipefail
          release_id=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq .databaseId)
          mkdir -p draft-assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate --jq '.[] | [.id, .name] | @tsv' |
            while IFS=$'\t' read -r asset_id asset_name; do
              gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                --header "Accept: application/octet-stream" > "draft-assets/${asset_name}"
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install package inspectors
        run: sudo apt-get update && sudo apt-get install --yes dpkg rpm

      - name: Compare draft assets with tested artifacts
        run: just artifacts dist draft-assets

      - name: Publish verified release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-failed-draft:
    if: ${{ always() && needs.build-draft.result == 'success' && needs.publish-release.result != 'success' }}
    needs:
      - build-draft
      - native-artifact-validation
      - publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete failed draft release
        run: gh release delete "${GITHUB_REF_NAME}" --yes --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
