name: Compatibility

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-multiplexers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install current Zellij and Herdr
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aht-compat/bin" "$RUNNER_TEMP/aht-compat/zellij"
          gh release download --repo zellij-org/zellij --pattern 'zellij-x86_64-unknown-linux-musl.tar.gz' --dir "$RUNNER_TEMP/aht-compat"
          tar -xzf "$RUNNER_TEMP/aht-compat/zellij-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/aht-compat/zellij"
          install -m 0755 "$RUNNER_TEMP/aht-compat/zellij/zellij" "$RUNNER_TEMP/aht-compat/bin/zellij"
          gh release download --repo herdrdev/herdr --pattern 'herdr-linux-x86_64' --output "$RUNNER_TEMP/aht-compat/bin/herdr"
          chmod 0755 "$RUNNER_TEMP/aht-compat/bin/herdr"
          echo "$RUNNER_TEMP/aht-compat/bin" >> "$GITHUB_PATH"

      - name: Probe current multiplexer discovery and capture
        env:
          AHT_REQUIRE_MULTIPLEXERS: "1"
        run: go test -count=1 -tags=integration ./internal/observer -run '^TestCurrent(Zellij|Herdr)DiscoveryAndCapture$' -timeout 60s

  current-hosts:
    name: Current ${{ matrix.harness }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - harness: claude
            install: npm install --global @anthropic-ai/claude-code
          - harness: codex
            install: npm install --global @openai/codex
          - harness: cursor
            install: curl -fsSL https://cursor.com/install | bash
          - harness: copilot
            install: npm install --global @github/copilot
          - harness: cline
            install: npm install --global cline
          - harness: kimi-code
            install: uv tool install kimi-cli
          - harness: grok
            install: curl -fsSL https://x.ai/cli/install.sh | bash
          - harness: goose
            install: curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
          - harness: pi
            install: npm install --global @earendil-works/pi-coding-agent
          - harness: omp
            install: npm install --global @oh-my-pi/pi-coding-agent
          - harness: opencode
            install: npm install --global opencode-ai
          - harness: agy
            install: curl -fsSL https://antigravity.google/cli/install.sh | bash
          - harness: kilo
            install: npm install --global @kilocode/cli
          - harness: droid
            install: curl -fsSL https://app.factory.ai/cli | sh
          - harness: openclaw
            install: npm install --global openclaw
          - harness: hermes
            install: pipx install hermes-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Bun for OMP
        if: matrix.harness == 'omp'
        uses: oven-sh/setup-bun@v2

      - name: Install current harness into runner prefix
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:$PATH"
          ${{ matrix.install }}
          printf '%s\n' "$HOME/.local/bin" "$HOME/.cursor/bin" "$HOME/.grok/bin" >> "$GITHUB_PATH"

      - name: Exercise installed integration and host
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/aht-compat-diagnostics"
          AHT_COMPAT_HARNESS="${{ matrix.harness }}" go test -count=1 -v -tags=compatibility ./internal/hostcompat -run '^TestCurrentHarnessLifecycle$' -timeout 90s 2>&1 |
            tee "$RUNNER_TEMP/aht-compat-diagnostics/${{ matrix.harness }}.log"

      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-${{ matrix.harness }}-diagnostics
          path: ${{ runner.temp }}/aht-compat-diagnostics/${{ matrix.harness }}.log
          if-no-files-found: ignore
          retention-days: 14

  compatibility-summary:
    name: Compatibility summary
    if: always()
    needs: [current-multiplexers, current-hosts]
    runs-on: ubuntu-24.04
    steps:
      - name: Download host diagnostics
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: current-*-diagnostics
          path: diagnostics
          merge-multiple: true

      - name: Summarize matrix
        env:
          MULTIPLEXERS_RESULT: ${{ needs.current-multiplexers.result }}
          HOSTS_RESULT: ${{ needs.current-hosts.result }}
        shell: bash
        run: |
          set -euo pipefail
          harnesses=(claude codex cursor copilot cline kimi-code grok goose pi omp opencode agy kilo droid openclaw hermes)
          {
            echo "## Weekly compatibility"
            echo
            echo "| Boundary | Result |"
            echo "| --- | --- |"
            echo "| Current multiplexers | $MULTIPLEXERS_RESULT |"
            echo "| 16 current harnesses | $HOSTS_RESULT |"
            echo
            echo "| Harness | Coverage | Observed version |"
            echo "| --- | --- | --- |"
            for harness in "${harnesses[@]}"; do
              coverage=lifecycle
              if [[ "$harness" == cursor || "$harness" == agy ]]; then
                coverage=discovery
              fi
              version=unavailable
              log="diagnostics/$harness.log"
              if [[ -f "$log" ]]; then
                observed="$(sed -n "s/.*current $harness: //p" "$log" | sed -n '1p')"
                if [[ -n "$observed" ]]; then
                  version="${observed//|/\\|}"
                fi
              fi
              echo "| $harness | $coverage | $version |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          test "$MULTIPLEXERS_RESULT" = success
          test "$HOSTS_RESULT" = success
