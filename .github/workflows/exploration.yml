name: Exploration

on:
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exploration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/agentstate
            target: FuzzNormalizeSnapshotBounded
          - package: ./internal/agentstate
            target: FuzzParseManifest
          - package: ./internal/processinfo
            target: FuzzParseLinuxStat
          - package: ./internal/harness/catalog
            target: FuzzPayloadAdapters
          - package: ./pkg/tmux
            target: FuzzParseCurrent
          - package: ./pkg/tmux
            target: FuzzParseListPanes
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go
        with:
          profile: fuzz-${{ matrix.target }}

      - name: Restore target corpus
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.go.outputs.build-cache }}/fuzz
          key: aht-fuzz-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aht-fuzz-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-

      - name: Run bounded fuzz target
        shell: bash
        run: go test "${{ matrix.package }}" -run '^$' -fuzz "^${{ matrix.target }}$" -fuzztime 2m -timeout 3m 2>&1 | tee fuzz.log

      - name: Preserve minimized failures and replay evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.package }}/testdata/fuzz
            ${{ steps.go.outputs.build-cache }}/fuzz
            fuzz.log
          if-no-files-found: error
          retention-days: 30

      - name: Save target corpus after exploration
        if: always() && steps.go.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.go.outputs.build-cache }}/fuzz
          key: aht-fuzz-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

  vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          profile: vulnerabilities

      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
