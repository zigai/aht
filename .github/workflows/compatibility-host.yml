name: Harness compatibility

on:
  workflow_call:
    inputs:
      harness:
        required: true
        type: string
      version:
        default: ''
        type: string
      attempts:
        description: Lifecycle test attempts; a pass on any attempt counts as success
        default: 1
        type: number
      artifact:
        description: Snapshot artifact containing the Linux-amd64 release build
        default: ''
        type: string
      release-tag:
        description: Published release binary and test source to exercise
        default: ''
        type: string

permissions:
  contents: read

jobs:
  host:
    name: ${{ inputs.harness }} ${{ inputs.version || 'current' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AHT_COMPAT_HARNESS: ${{ inputs.harness }}
      AHT_COMPAT_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout published compatibility tests
        if: inputs.release-tag != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag }}
          path: host-source
          persist-credentials: false

      - name: Require published prebuilt test support
        if: inputs.release-tag != ''
        shell: bash
        run: |
          if ! grep -Fq 'AHT_COMPAT_BINARY' host-source/test/hostcompat/command_test.go; then
            echo "The published release's compatibility tests do not accept a prebuilt binary; publish a release containing that support before scheduling release checks." >&2
            exit 1
          fi

      - name: Resolve tested revision
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "commit=$(git -C host-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Download snapshot binary
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/aht-snapshot

      - name: Extract snapshot binary
        if: inputs.artifact != ''
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=$(jq -er '.[] | select(.type == "Archive" and .goos == "linux" and .goarch == "amd64") | .name' "$RUNNER_TEMP/aht-snapshot/artifacts.json")
          mkdir -p "$RUNNER_TEMP/aht-compat-binary"
          tar -xzf "$RUNNER_TEMP/aht-snapshot/$ARCHIVE" -C "$RUNNER_TEMP/aht-compat-binary" aht
          chmod 0755 "$RUNNER_TEMP/aht-compat-binary/aht"
          echo "AHT_COMPAT_BINARY=$RUNNER_TEMP/aht-compat-binary/aht" >> "$GITHUB_ENV"

      - name: Download published binary
        if: inputs.release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aht-compat-binary"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'aht_*_linux_amd64.tar.gz' --output "$RUNNER_TEMP/aht-compat-binary/release.tar.gz"
          tar -xzf "$RUNNER_TEMP/aht-compat-binary/release.tar.gz" -C "$RUNNER_TEMP/aht-compat-binary" aht
          chmod 0755 "$RUNNER_TEMP/aht-compat-binary/aht"
          echo "AHT_COMPAT_BINARY=$RUNNER_TEMP/aht-compat-binary/aht" >> "$GITHUB_ENV"
      - name: Set diagnostics directory
        run: echo "AHT_COMPAT_WORK=$RUNNER_TEMP/aht-compat-diagnostics" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          profile: host

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Set up Bun for OMP
        if: inputs.harness == 'omp'
        uses: oven-sh/setup-bun@v2

      - name: Install harness
        id: install
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$AHT_COMPAT_WORK"
          go run ./internal/tools/compatibility install 2>&1 | tee "$AHT_COMPAT_WORK/$AHT_COMPAT_HARNESS-install.log"

      - name: Install tmux
        uses: ./.github/actions/setup-tmux

      # Each attempt builds fresh isolated hosts, so a retry cannot inherit state.
      - name: Exercise installed integration and host
        id: lifecycle
        shell: bash
        working-directory: ${{ inputs.release-tag != '' && 'host-source' || '.' }}
        env:
          ATTEMPTS: ${{ inputs.attempts }}
        run: |
          set -o pipefail
          log="$AHT_COMPAT_WORK/$AHT_COMPAT_HARNESS.log"
          : > "$log"
          for ((attempt = 1; attempt <= ATTEMPTS; attempt++)); do
            echo "=== lifecycle attempt $attempt of $ATTEMPTS" | tee -a "$log"
            if go test -count=1 -v -tags=compatibility ./test/hostcompat -run '^TestCurrentHarnessLifecycle$' -timeout 10m 2>&1 |
              tee -a "$log"; then
              if ((attempt > 1)); then
                echo "::warning title=Flaky lifecycle test::$AHT_COMPAT_HARNESS ${AHT_COMPAT_VERSION:-current} passed on attempt $attempt of $ATTEMPTS"
              fi
              exit 0
            fi
          done
          exit 1

      - name: Record result
        if: always()
        env:
          AHT_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AHT_TEST_OUTCOME: ${{ steps.lifecycle.outcome }}
          GITHUB_SHA: ${{ steps.source.outputs.commit }}
        run: go run ./internal/tools/compatibility result

      - name: Upload sanitized diagnostics and result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-${{ inputs.harness }}-diagnostics
          path: |
            ${{ runner.temp }}/aht-compat-diagnostics/${{ inputs.harness }}.log
            ${{ runner.temp }}/aht-compat-diagnostics/${{ inputs.harness }}-install.log
            ${{ runner.temp }}/aht-compat-diagnostics/${{ inputs.harness }}-result.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
