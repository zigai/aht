name: Set up Go with a workload cache
description: Keep selector, verification, host, and release build caches independent.
inputs:
  profile:
    description: Workload that owns this compilation and module cache
    required: true
outputs:
  build-cache:
    description: Go build cache directory
    value: ${{ steps.paths.outputs.build }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      id: go
      with:
        go-version-file: go.mod
        cache: false
    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        mkdir -p "$(go env GOCACHE)" "$(go env GOMODCACHE)"
    # PR writes remain scoped to their merge ref by the Actions cache service.
    # A new source revision can save useful work even if dependencies did not change.
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ${{ steps.paths.outputs.build }}
          ${{ steps.paths.outputs.modules }}
        key: aht-go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.profile }}-${{ hashFiles('go.sum', 'Justfile', '.github/actions/setup-go/action.yml') }}-${{ github.sha }}
        restore-keys: |
          aht-go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.profile }}-${{ hashFiles('go.sum', 'Justfile', '.github/actions/setup-go/action.yml') }}-
          aht-go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.profile }}-
