name: Set up pinned golangci-lint
description: Install the version selected by Justfile and cache its analysis output.
runs:
  using: composite
  steps:
    - name: Read tool version and cache paths
      id: tool
      shell: bash
      run: |
        echo "version=$(just --evaluate golangci_lint_version)" >> "$GITHUB_OUTPUT"
        echo "directory=$HOME/.local/share/aht-ci/golangci-lint" >> "$GITHUB_OUTPUT"
        echo "analysis=$HOME/.cache/aht-golangci-lint" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: binary
      with:
        path: ${{ steps.tool.outputs.directory }}
        key: aht-lint-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool.outputs.version }}-${{ hashFiles('.github/scripts/install-lint.sh', '.github/golangci-lint-checksums.txt') }}
    - name: Install verified linter binary
      if: steps.binary.outputs.cache-hit != 'true'
      shell: bash
      env:
        AHT_LINT_DIRECTORY: ${{ steps.tool.outputs.directory }}
      run: bash .github/scripts/install-lint.sh
    - name: Select installed linter for Justfile
      shell: bash
      env:
        AHT_LINT_DIRECTORY: ${{ steps.tool.outputs.directory }}
        AHT_LINT_ANALYSIS: ${{ steps.tool.outputs.analysis }}
      run: |
        "$AHT_LINT_DIRECTORY/golangci-lint" version
        echo "AHT_GOLANGCI_LINT=$AHT_LINT_DIRECTORY/golangci-lint" >> "$GITHUB_ENV"
        echo "GOLANGCI_LINT_CACHE=$AHT_LINT_ANALYSIS" >> "$GITHUB_ENV"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.tool.outputs.analysis }}
        key: aht-lint-analysis-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool.outputs.version }}-${{ hashFiles('go.mod', 'go.sum', '.golangci.yaml') }}-${{ github.sha }}
        restore-keys: |
          aht-lint-analysis-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool.outputs.version }}-${{ hashFiles('go.mod', 'go.sum', '.golangci.yaml') }}-
