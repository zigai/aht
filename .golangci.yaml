version: "2"

run:
  timeout: 3m
  build-tags:
    - integration
    - compatibility

formatters:
  enable:
    - goimports
    - gofumpt
    - golines
  settings:
    gofumpt:
      extra:
        balance-calls: true
    golines:
      max-len: 100
    goimports:
      local-prefixes:
        - github.com/zigai/aht/v2

linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - forcetypeassert
    - forbidigo
    - funcorder
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - godoclint
    - godot
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint

  settings:
    thelper:
      benchmark:
        begin: false
    embeddedstructfieldcheck:
      forbid-mutex: true
    depguard:
      rules:
        registry:
          files: ["**/pkg/registry/*.go", "!$test"]
          deny:
            - pkg: github.com/zigai/aht/v2/internal
              desc: Registry is a pure domain and persistence package; inject harness rules.
        registry_tests:
          list-mode: lax
          files: ["**/pkg/registry/*_test.go"]
          allow:
            - github.com/zigai/aht/v2/internal/registrycheck/core$
          deny:
            - pkg: github.com/zigai/aht/v2/internal
              desc: Registry tests may import only the shared registry checker core.
        adapter_consumers:
          list-mode: lax
          files: ["**/internal/cli/*.go", "**/internal/fakeprovidercli/*.go", "**/pkg/history/*.go", "**/internal/observer/*.go", "**/internal/agentstate/*.go"]
          allow:
            - github.com/zigai/aht/v2/internal/harness/catalog$
            - github.com/zigai/aht/v2/internal/harness/transcript
          deny:
            - pkg: github.com/zigai/aht/v2/internal/harness/
              desc: Dispatch through the catalog and shared transcript capability.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '(^|\.)Harness(Claude|Codex|Cursor|Copilot|Cline|KimiCode|Grok|Goose|Pi|Omp|OpenCode|Agy|Kilo|Droid|OpenClaw|Hermes|Amp|Crush|Qwen|PrimeAgent)$'
          msg: Harness names belong to adapters and the public constants file.
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
        - switch
    gochecksumtype:
      default-signifies-exhaustive: false
    cyclop:
      max-complexity: 12
    decorder:
      disable-dec-order-check: false
      dec-order:
        - const
        - var
        - type
        - func
    funcorder:
      function: true
    gocognit:
      min-complexity: 20
    goconst:
      min-occurrences: 16
    lll:
      line-length: 120
      tab-width: 4
    gocritic:
      enabled-tags: [diagnostic]
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
    godoclint:
      enable:
        - no-unused-link
        - require-stdlib-doclink
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    mnd:
      ignored-numbers:
        - "0o600"
        - "0o644"
        - "0o700"
        - "0o750"
        - "0600"
        - "0644"
        - "0700"
        - "0750"
    misspell:
      locale: US
    nakedret:
      max-func-lines: 5
    revive:
      rules:
        - name: error-naming
        - name: if-return
        - name: var-naming
          arguments: [[], ["GRPC", "IOS"]]
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T,testing.TB,*testing.B,*testing.F"
        - name: import-shadowing
        - name: package-naming
          arguments:
            - check-extra-bad-name: true
              user-defined-bad-names: [handlers]
        - name: package-directory-mismatch
        - name: filename-format
          arguments: ["^[a-z0-9][a-z0-9_]*\\.go$"]
        - name: exported
          arguments:
            - disable-checks-on-constants
            - disable-checks-on-functions
            - disable-checks-on-methods
            - disable-checks-on-types
            - disable-checks-on-variables
        - name: redundant-import-alias
        - name: import-alias-naming
        - name: dot-imports
        - name: blank-imports
        - name: error-strings
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: modifies-parameter
        - name: enforce-repeated-arg-type-style
          arguments: ["full"]
        - name: unreachable-code
          disabled: true
        - name: redefines-builtin-id
          disabled: true
    rowserrcheck:
      packages:
        - github.com/jmoiron/sqlx
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1016
        - -QF1008
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
          toml: snake
    nolintlint:
      allow-no-explanation: [gocognit, golines]
      require-explanation: true
      require-specific: true
    gosec:
      excludes:
        - G204 # subprocess launched with variable
        - G301 # directory perms
        - G302 # file perms
        - G304 # file path from variable
    exhaustruct_v5:
      allow-empty-returns: true
      # Types whose zero fields mean "use the default". Mark such types in
      # this module with //exhaustruct:optional instead of listing them here.
      ignore-patterns:
        - "^github\\.com/spf13/cobra\\..+$"
        - "^github\\.com/spf13/pflag\\..+$"
        - "^github\\.com/urfave/cli(/v[0-9]+)?\\..+$"
        - "^net/http\\.(Client|Server|Transport)$"
        - "^net\\.(Dialer|ListenConfig)$"
        - "^net/url\\.URL$"
        - "^crypto/tls\\.Config$"
        - "^log/slog\\.HandlerOptions$"
        - "^os/exec\\.Cmd$"
        - "^syscall\\.SysProcAttr$"
        - "^github\\.com/zigai/gotmux/tmux\\.Config$"
        - "^github\\.com/zigai/gotmux/tmux\\.CaptureOptions$"
        - "^github\\.com/zigai/gotmux/tmux\\.NewSessionOptions$"
        - "^github\\.com/zigai/gotmux/tmux\\.RespawnOptions$"
        - "^github\\.com/jedib0t/go-pretty/v6/table\\.ColumnConfig$"
        - "^golang\\.org/x/sys/unix\\.PollFd$"
  exclusions:
    warn-unused: false
    presets: []
    rules:
      - path: '(^internal/harness/|^pkg/aht/harnesses\.go$|_test\.go$)'
        linters: [forbidigo]
      - path: "main\\.go"
        linters: [mnd]
      - path: "internal/install/.*\\.go"
        linters: [dupl]

      - linters: [goconst]
        text: "string `Stop` has .* occurrences"

      - path: "_test\\.go"
        linters: [cyclop, gocognit, exhaustruct_v5, goconst]

      # A test writes its own output to paths the developer running it chooses.
      - path: ".*_test\\.go"
        linters: [gosec]
        text: "G703:"

      # Test-helper packages (named like httptest) only build fixtures.
      - path: "(^|/)[a-z0-9]+test/"
        linters: [exhaustruct_v5]

      - path: "_test\\.go"
        linters: [goconst]

      - path: ".*_test\\.go"
        linters: [decorder, funcorder, dupl, maintidx]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
